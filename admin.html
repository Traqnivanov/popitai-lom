<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html.admin-shell-starting .admin-stats,html.admin-shell-starting .admin-layout{visibility:hidden}
    @media(max-width:780px){
      body.admin-panel-v2.admin-sidebar-collapsed .admin-menu{overflow:auto;padding:10px}
      body.admin-panel-v2.admin-sidebar-collapsed .admin-menu>.admin-menu-home{display:block}
      body.admin-panel-v2.admin-sidebar-collapsed .admin-menu>.admin-menu-group{display:grid}
      body.admin-panel-v2 .admin-menu-footer{display:none}
    }
  </style>
  <script>document.documentElement.classList.add("admin-shell-starting");</script>

<body class="admin-panel-v2" data-skip-supabase-content="true">
  <a class="skip-link" href="#main-content">Към основното съдържание</a>

  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <button class="admin-mobile-menu-button" type="button" data-admin-mobile-menu aria-label="Отвори менюто" aria-expanded="false" aria-controls="admin-navigation">☰</button>
      <a class="admin-topbar-brand" href="admin.html" aria-label="Начало на панела">
        <img src="assets/popitai-lom-logo-mark-256.webp" width="36" height="36" alt="">
        <span>Попитай.Лом</span>
      </a>
      <span class="admin-topbar-separator">/</span>
      <span class="admin-topbar-title">Панел</span>
      <div class="admin-topbar-actions">
        <button class="admin-topbar-tasks" type="button" data-admin-topbar-tasks data-admin-view="dashboard" hidden>Зареждане на задачите…</button>
        <a class="admin-topbar-link" href="index.html">Към сайта</a>
        <a class="admin-topbar-profile" href="profil.html">Профил</a>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="section-container">
        <span class="section-kicker">Управление</span>
        <h1>Панел за управление</h1>
        <p>Зареждане на достъпа и текущите задачи…</p>
      </div>
    </section>

    <section class="content-section">
      <div class="section-container">
        <section class="admin-test-tools" hidden></section>
        <div class="admin-stats">
          <article><strong>0</strong><span>Потребители</span></article>
          <article><strong>0</strong><span>Чакащи</span></article>
          <article><strong>0</strong><span>Въпроси</span></article>
          <article><strong>0</strong><span>Отговори</span></article>
        </div>
        <div class="admin-layout">
          <aside class="admin-menu" id="admin-navigation" aria-label="Административна навигация"><button class="active" type="button">Зареждане…</button></aside>
          <div class="admin-content"><div class="block-heading"><h2>Администрация</h2></div><div class="stack-list"><article class="empty-card"><p>Зареждане на панела…</p></article></div></div>
        </div>
      </div>
    </section>
  </main>

  <div class="admin-mobile-overlay" data-admin-mobile-overlay hidden></div>
  <nav class="admin-mobile-bottom-nav" aria-label="Навигация на панела">
    <button type="button" data-admin-mobile-tab="dashboard">Начало</button>
    <button type="button" data-admin-mobile-tab="review">Преглед</button>
    <button type="button" data-admin-mobile-tab="content">Съдържание</button>
    <button type="button" data-admin-mobile-tab="menu">Меню</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js?v=20260824-2140" defer></script>
