name: Category hub cache recovery

on:
  push:
    branches:
      - post-marketplace-category-hub-cache

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-marketplace-category-hub-cache
          fetch-depth: 1

      - name: Synchronize category hub cache key with file blob
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          version = subprocess.check_output(['git', 'hash-object', 'category-hub-v1.js'], text=True).strip()[:12]
          target = f'category-hub-v1.js?v={version}'
          changed = []
          seen = []
          pattern = re.compile(r'category-hub-v1\.js\?v=[^"\']+')
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8-sig')
              if 'category-hub-v1.js?v=' not in text:
                  continue
              seen.append(path.name)
              updated = pattern.sub(target, text)
              if updated != text:
                  bom = path.read_bytes().startswith(b'\xef\xbb\xbf')
                  path.write_bytes((b'\xef\xbb\xbf' if bom else b'') + updated.encode('utf-8'))
                  changed.append(path.name)
          print('Expected cache key:', target)
          print('Category hub pages:', ', '.join(sorted(seen)))
          print('Updated:', ', '.join(sorted(changed)) if changed else 'none')
          if not seen:
              raise SystemExit('No category-hub references found')
          PY

      - name: Guard blob-derived cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          version = subprocess.check_output(['git', 'hash-object', 'category-hub-v1.js'], text=True).strip()[:12]
          expected = f'category-hub-v1.js?v={version}'
          bad = []
          count = 0
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8-sig')
              if 'category-hub-v1.js?v=' not in text:
                  continue
              count += 1
              if expected not in text:
                  bad.append(path.name)
          if bad:
              raise SystemExit('Stale category-hub cache key: ' + ', '.join(sorted(bad)))
          print(f'Blob cache-key guard PASS across {count} page(s): {expected}')
          PY

      - name: Verify canonical public shell
        run: python .github/scripts/sync_public_shell.py --check

      - name: Commit recovered references
        run: |
          if git diff --quiet; then
            echo 'Category hub cache keys already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Use blob-derived category hub cache key"
          git push origin "HEAD:post-marketplace-category-hub-cache"
