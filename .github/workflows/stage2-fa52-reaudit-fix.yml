name: Stage 2 fa52 exact candidate QA

on:
  push:
    branches:
      - prototype/content-complete-ia-20260905-fa52-reaudit-fix-tmp
    paths:
      - .github/workflows/stage2-fa52-reaudit-fix.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ed196284ab27a0f8567a6b5869a8bb0885798f4b
          fetch-depth: 2
      - name: Verify exact SHA and clean status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ed196284ab27a0f8567a6b5869a8bb0885798f4b"
          test -z "$(git status --short)"
          git diff --name-only fa52dc8b89006b7978e266dd846786e1a858a17f HEAD
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check prototype-final-ia/prototype-content-views.js
          node --check prototype-final-ia/prototype-marketplace-views.js
          node --check prototype-final-ia/prototype-records.js
          node --check prototype-final-ia/prototype-regression-audit.js
      - name: Run committed regression audit
        shell: bash
        run: |
          set -euo pipefail
          node prototype-final-ia/prototype-regression-audit.js
