name: Apply full Popitai Lom design

on:
  push:
    paths:
      - '.github/workflows/repair-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-full-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete version with cover, original logo and icons
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="a3875b3c48553a68f4eb0196466ae5e133539a45"

          files=(
            admin.html
            avtomobili.html
            biskvitki.html
            dobavi-firma.html
            firma.html
            firmi.html
            image-upload.js
            index.html
            kategorii.html
            kontakti.html
            magazini.html
            maistori.html
            nov-vapros.html
            obyavi.html
            poveritelnost.html
            pravila.html
            profil.html
            rabota.html
            registracia.html
            sabitiya.html
            script.js
            signal.html
            statia.html
            statii.html
            style.css
            tarsene.html
            uslovia.html
            vapros.html
            vaprosi.html
            vhod.html
            za-nas.html
            zavedenia.html
            zdrave.html
          )

          for file in "${files[@]}"; do
            git show "${SOURCE_COMMIT}:docs/${file}" > "${file}"
          done

          rm -rf assets
          mkdir -p assets

          git show "${SOURCE_COMMIT}:logo-full.svg" > assets/favicon-96.png
          git show "${SOURCE_COMMIT}:logo-mark.svg" > assets/logo-full.svg
          git show "${SOURCE_COMMIT}:lom-cover-desktop-1536.webp" > assets/logo-mark.svg
          git show "${SOURCE_COMMIT}:lom-cover-mobile-720.webp" > assets/lom-cover-desktop-1536.webp
          git show "${SOURCE_COMMIT}:lom-cover-share-1200x630.webp" > assets/lom-cover-mobile-720.webp
          git show "${SOURCE_COMMIT}:popitai-lom-logo-mark-256.webp" > assets/lom-cover-share-1200x630.webp
          git show "${SOURCE_COMMIT}:popitai-lom-logo-original-512.webp" > assets/popitai-lom-logo-mark-256.webp
          git show "${SOURCE_COMMIT}:admin.html" > assets/popitai-lom-logo-original-512.webp

          printf '' > .nojekyll

          rm -rf docs
          rm -f favicon-96.png logo-full.svg logo-mark.svg
          rm -f lom-cover-desktop-1536.webp lom-cover-mobile-720.webp lom-cover-share-1200x630.webp
          rm -f popitai-lom-logo-mark-256.webp popitai-lom-logo-original-512.webp
          rm -f '#U0421#U0422#U0410#U0422#U0423#U0421.txt'

          # This workflow is no longer needed after the clean deployment.
          rm -f .github/workflows/repair-site.yml

          git config user.name "Popitai Lom Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Добавяне на корицата, оригиналното лого и коригираните икони"
          git push origin HEAD:main
