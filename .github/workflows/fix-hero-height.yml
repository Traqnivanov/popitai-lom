name: Fix hero height and refresh styles

on:
  push:
    paths:
      - '.github/workflows/fix-hero-height.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply compact laptop hero and cache refresh
        shell: bash
        run: |
          set -euo pipefail

          cat >> style.css <<'CSS'
          
          /* Laptop hero correction — 2026-08-05 */
          .hero-cover {
            height: clamp(540px, 64vh, 610px);
            min-height: 540px;
          }

          .hero-cover-media {
            z-index: 0;
          }

          .hero-cover-overlay {
            z-index: 1;
            pointer-events: none;
          }

          .hero-cover-inner {
            position: relative;
            z-index: 2;
            min-height: 100%;
            padding: 28px 0 34px;
          }

          @media (max-height: 760px) and (min-width: 761px) {
            .hero-cover {
              height: 500px;
              min-height: 500px;
            }

            .hero-cover-inner {
              padding: 20px 0 24px;
            }

            .hero-cover-brand {
              margin-bottom: 8px;
            }

            .hero-cover-brand img {
              width: 50px;
              height: 50px;
              border-radius: 15px;
            }

            .hero-cover h1 {
              font-size: clamp(34px, 3.8vw, 48px);
            }

            .hero-cover-lead {
              margin-top: 10px;
              font-size: 18px;
            }

            .hero-cover-support,
            .hero-cover-popular {
              display: none;
            }

            .hero-cover-search {
              margin-top: 14px;
            }

            .hero-cover-actions {
              margin-top: 11px;
            }
          }

          @media (max-width: 760px) {
            .hero-cover {
              height: auto;
              min-height: auto;
            }

            .hero-cover-inner {
              min-height: 650px;
            }
          }
          CSS

          version='20260805-0205'
          for file in *.html; do
            sed -i -E "s#href=\"style\.css(\?[^\"]*)?\"#href=\"style.css?v=${version}\"#g" "$file"
            sed -i -E "s#src=\"script\.js(\?[^\"]*)?\"#src=\"script.js?v=${version}\"#g" "$file"
          done

          rm -f .github/workflows/fix-hero-height.yml

          git config user.name 'Popitai Lom Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Намаляване на корицата за лаптоп и обновяване на стиловете'
          git push origin HEAD:main
