name: Fix hero height and refresh styles

on:
  push:
    paths:
      - '.github/workflows/fix-hero-height.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply compact laptop hero and cache refresh
        shell: bash
        run: |
          set -euo pipefail

          cat >> style.css <<'CSS'

/* Laptop hero correction — 2026-08-05 */
.hero-cover {
  height: clamp(560px, 68vh, 640px);
  min-height: 560px;
}

.hero-cover-media {
  z-index: 0;
}

.hero-cover-overlay {
  z-index: 1;
  pointer-events: none;
}

.hero-cover-inner {
  position: relative;
  z-index: 2;
  min-height: 100%;
  padding: 34px 0 40px;
}

@media (max-height: 760px) and (min-width: 761px) {
  .hero-cover {
    height: 520px;
    min-height: 520px;
  }

  .hero-cover-inner {
    padding: 24px 0 28px;
  }

  .hero-cover-brand {
    margin-bottom: 10px;
  }

  .hero-cover-brand img {
    width: 54px;
    height: 54px;
    border-radius: 16px;
  }

  .hero-cover h1 {
    font-size: clamp(36px, 4vw, 52px);
  }

  .hero-cover-lead {
    margin-top: 12px;
    font-size: 19px;
  }

  .hero-cover-support,
  .hero-cover-popular {
    display: none;
  }

  .hero-cover-search {
    margin-top: 17px;
  }

  .hero-cover-actions {
    margin-top: 13px;
  }
}

@media (max-width: 760px) {
  .hero-cover {
    height: auto;
    min-height: auto;
  }

  .hero-cover-inner {
    min-height: 650px;
  }
}
CSS

          version='20260805-0200'
          for file in *.html; do
            sed -i -E "s#href=\"style\.css(\?[^\"]*)?\"#href=\"style.css?v=${version}\"#g" "$file"
            sed -i -E "s#src=\"script\.js(\?[^\"]*)?\"#src=\"script.js?v=${version}\"#g" "$file"
          done

          rm -f .github/workflows/fix-hero-height.yml

          git config user.name 'Popitai Lom Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Намаляване на корицата за лаптоп и обновяване на стиловете'
          git push origin HEAD:main
