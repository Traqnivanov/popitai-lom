name: TEMP Stage5 contextual mobile priority fix

on:
  push:
    paths:
      - ".github/workflows/stage5-context-mobile-fix-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch existing mobile-priority owner and cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("category-listings-v1.js")
          text = js_path.read_text(encoding="utf-8")
          start_marker = "  function setupMobilePriorityGrid(grid, index) {"
          end_marker = "\n\n  mobilePriorityGrids.forEach(setupMobilePriorityGrid);"
          assert text.count(start_marker) == 1, "unexpected setupMobilePriorityGrid count"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''  function setupMobilePriorityGrid(grid, index) {
            const units = Array.from(grid.children).filter((element) =>
              element.matches(".subcategory-card, .contextual-subcategory-item")
            );
            const priority = String(grid.dataset.mobilePriority || "")
              .split("|")
              .map((value) => value.trim())
              .filter(Boolean);
            if (!units.length || !priority.length) return;

            if (!grid.id) grid.id = `category-subcategories-${index + 1}`;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "category-mobile-expand secondary-link-button";
            button.textContent = "Всички услуги";
            button.setAttribute("aria-controls", grid.id);
            button.setAttribute("aria-expanded", "false");
            button.hidden = true;
            grid.insertAdjacentElement("afterend", button);

            const media = window.matchMedia("(max-width: 720px)");
            let expanded = false;

            function unitCard(unit) {
              if (unit.matches(".subcategory-card")) return unit;
              return unit.querySelector(":scope > .subcategory-card");
            }

            function unitLabel(unit) {
              return String(unitCard(unit)?.querySelector("strong")?.textContent || "").trim();
            }

            function sync() {
              if (!media.matches) {
                units.forEach((unit) => {
                  unit.hidden = false;
                  unit.style.order = "";
                });
                button.hidden = true;
                return;
              }

              units.forEach((unit, unitIndex) => {
                const label = unitLabel(unit);
                const priorityIndex = priority.indexOf(label);
                unit.style.order = String(priorityIndex >= 0 ? priorityIndex : 100 + unitIndex);
                unit.hidden = !expanded && priorityIndex < 0;
              });
              button.hidden = false;
              button.setAttribute("aria-expanded", String(expanded));
              button.textContent = expanded ? "Покажи по-малко" : "Всички услуги";
            }

            button.addEventListener("click", () => {
              expanded = !expanded;
              sync();
            });
            if (media.addEventListener) media.addEventListener("change", sync);
            else media.addListener(sync);
            sync();
          }'''
          js_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          old = 'category-listings-v1.js?v=20260830-stage3'
          new = 'category-listings-v1.js?v=20260830-recovery-mobile1'
          for name in ("maistori.html", "avtomobili.html", "rabota.html"):
              path = Path(name)
              html = path.read_text(encoding="utf-8-sig")
              assert html.count(old) == 1, f"{name}: expected one old category-listings cache key"
              html = html.replace(old, new, 1)
              raw = path.read_bytes()
              prefix = b"\xef\xbb\xbf" if raw.startswith(b"\xef\xbb\xbf") else b""
              path.write_bytes(prefix + html.encode("utf-8"))
          PY
      - run: node --check category-listings-v1.js
      - name: Verify exact compatibility contract
        shell: bash
        run: |
          grep -F 'element.matches(".subcategory-card, .contextual-subcategory-item")' category-listings-v1.js
          grep -F 'unit.hidden = !expanded && priorityIndex < 0' category-listings-v1.js
          for f in maistori.html avtomobili.html rabota.html; do
            grep -F 'category-listings-v1.js?v=20260830-recovery-mobile1' "$f"
          done
          python .github/scripts/apply_contextual_recovery.py --check
          python .github/scripts/sync_public_shell.py --check
      - name: Commit only final fix files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- category-listings-v1.js maistori.html avtomobili.html rabota.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix contextual mobile priority grouping"
          git push origin "HEAD:${GITHUB_REF_NAME}"
