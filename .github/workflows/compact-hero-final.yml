name: Compact desktop hero final

on:
  push:
    paths:
      - '.github/workflows/compact-hero-final.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make the laptop hero compact
        shell: bash
        run: |
          set -euo pipefail

          cat >> style.css <<'CSS'

/* Final compact desktop hero — 2026-08-05 */
@media (min-width: 761px) {
  .hero-cover {
    height: clamp(430px, 54vh, 500px);
    min-height: 430px;
  }

  .hero-cover-inner {
    min-height: 100%;
    padding: 24px 0 28px;
  }

  .hero-cover-content {
    width: min(620px, 100%);
  }

  .hero-cover-brand {
    gap: 12px;
    margin-bottom: 12px;
    font-size: 15px;
  }

  .hero-cover-brand img {
    width: 54px;
    height: 54px;
    border-radius: 16px;
  }

  .hero-cover h1 {
    max-width: 600px;
    font-size: clamp(34px, 3.6vw, 52px);
    line-height: 1.02;
    letter-spacing: -1.4px;
  }

  .hero-cover-lead {
    margin-top: 12px;
    font-size: clamp(17px, 1.55vw, 21px);
    line-height: 1.4;
  }

  .hero-cover-support {
    margin-top: 7px;
    font-size: 14px;
    line-height: 1.45;
  }

  .hero-cover-search {
    margin-top: 16px;
  }

  .hero-cover-search .search-field-wrap {
    padding: 6px;
  }

  .hero-cover-search .search-field-wrap input {
    height: 48px;
    font-size: 16px;
  }

  .hero-cover-search .search-button {
    height: 44px;
  }

  .hero-cover-actions {
    margin-top: 12px;
  }

  .hero-cover-primary,
  .hero-cover-secondary {
    min-height: 42px;
    padding: 0 16px;
    font-size: 14px;
  }

  .hero-cover-popular {
    display: none;
  }

  .hero-cover-media img {
    object-position: center 54%;
  }
}
CSS

          version='20260805-0210'
          for file in *.html; do
            sed -i -E "s#href=\"style\.css(\?[^\"]*)?\"#href=\"style.css?v=${version}\"#g" "$file"
          done

          rm -f .github/workflows/compact-hero-final.yml

          git config user.name 'Popitai Lom Layout'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Финално намаляване на корицата за лаптоп'
          git push origin HEAD:main
