name: Apply site status and error system

on:
  push:
    paths:
      - '.github/workflows/apply-error-system.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the prepared site changes
        run: python3 .github/scripts/apply_error_system.py

