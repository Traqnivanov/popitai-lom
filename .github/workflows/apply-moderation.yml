name: Apply moderation system

on:
  push:
    paths:
      - '.github/workflows/apply-moderation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mandatory admin approval
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          s = script_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing pattern: {label}')
              s = s.replace(old, new, 1)

          # Shared moderation helpers.
          marker = '''function saveBusinesses(items) {
            setStored("popitaiBusinesses", items);
          }
          '''
          addition = marker + '''
          function isApproved(item) {
            return item?.status === "approved" || item?.promoted === true;
          }

          function moderationLabel(status) {
            return ({
              pending: "Чака одобрение",
              approved: "Одобрено",
              rejected: "Отказано",
              needs_changes: "Нужна е корекция"
            })[status] || "Чака одобрение";
          }
          '''
          replace_once(marker, addition, 'moderation helpers')

          replace_once('''  const dynamicQuestions = getQuestions().map(item => ({''', '''  const dynamicQuestions = getQuestions().filter(isApproved).map(item => ({''', 'approved search questions')
          replace_once('''  const dynamicBusinesses = getBusinesses().map(item => ({''', '''  const dynamicBusinesses = getBusinesses().filter(isApproved).map(item => ({''', 'approved search businesses')

          # Registration stays automatic; public content becomes pending.
          replace_once('''        helpful: 0,
                isTest: false,
                images''', '''        helpful: 0,
                status: "pending",
                moderationNote: "",
                isTest: false,
                images''', 'question pending status')
          replace_once('''      qs("#new-question-message").textContent = "Въпросът и снимките са публикувани в тестовата версия.";
                setTimeout(() => window.location.href = questionUrl(id), 500);''', '''      qs("#new-question-message").textContent = "Въпросът е изпратен и чака одобрение от администратор.";
                setTimeout(() => window.location.href = "profil.html", 700);''', 'question pending message')

          replace_once('''        author: user.name,
                createdAt: new Date().toISOString()
              });''', '''        author: user.name,
                createdAt: new Date().toISOString(),
                status: "pending",
                moderationNote: ""
              });''', 'answer pending status')
          replace_once('''      qs("#answer-message").textContent = "Отговорът е добавен към правилния въпрос.";''', '''      qs("#answer-message").textContent = "Отговорът е изпратен и чака одобрение от администратор.";''', 'answer pending message')

          replace_once('''        status: "pending",
                createdAt: new Date().toISOString(),''', '''        status: "pending",
                moderationNote: "",
                owner: getStored("popitaiCurrentUser", { name: "Гост", email: "" }),
                createdAt: new Date().toISOString(),''', 'business owner and note')
          replace_once('''      qs("#company-message").textContent = "Фирмата и снимките са записани със статус „Чака преглед“.";''', '''      qs("#company-message").textContent = "Фирмата е изпратена и чака одобрение от администратор.";''', 'business pending message')

          # Public pages show only approved content; profile still shows the user's own submissions.
          replace_once('''if (questionsList) renderQuestionContainer(questionsList, getQuestions(), false);''', '''if (questionsList) renderQuestionContainer(questionsList, getQuestions().filter(isApproved), false);''', 'public questions')
          replace_once('''if (homeQuestions) renderQuestionContainer(homeQuestions, getQuestions().slice(0, 4), true);''', '''if (homeQuestions) renderQuestionContainer(homeQuestions, getQuestions().filter(isApproved).slice(0, 4), true);''', 'home questions')
          replace_once('''  renderQuestionContainer(container, getQuestions().filter(item => item.category === category).slice(0, 4), true);''', '''  renderQuestionContainer(container, getQuestions().filter(item => item.category === category && isApproved(item)).slice(0, 4), true);''', 'category questions')
          replace_once('''    const filtered = getQuestions().filter(item => {''', '''    const filtered = getQuestions().filter(item => isApproved(item)).filter(item => {''', 'question filters')

          replace_once('''  if (!question) {
              titleEl.textContent = "Въпросът не е намерен";''', '''  const canPreviewQuestion = currentUser && question && question.author === currentUser.name;
            if (!question || (!isApproved(question) && !canPreviewQuestion)) {
              titleEl.textContent = "Въпросът не е намерен";''', 'question access moderation')
          replace_once('''  const answers = Array.isArray(question.answers) ? question.answers : [];''', '''  const allAnswers = Array.isArray(question.answers) ? question.answers : [];
            const answers = allAnswers.filter(answer => isApproved(answer) || (currentUser && answer.author === currentUser.name));''', 'approved answers')

          replace_once('''renderBusinesses(qs("#businesses-list"), [IVANOV_REMONTI, ...getBusinesses()]);
          renderBusinesses(qs("#home-businesses"), getBusinesses(), 3);''', '''renderBusinesses(qs("#businesses-list"), [IVANOV_REMONTI, ...getBusinesses().filter(isApproved)]);
          renderBusinesses(qs("#home-businesses"), getBusinesses().filter(isApproved), 3);''', 'public businesses')
          replace_once('''  const item = String(id) === IVANOV_REMONTI.id
              ? IVANOV_REMONTI
              : getBusinesses().find(business => String(business.id) === String(id));
            if (!item) {''', '''  const item = String(id) === IVANOV_REMONTI.id
              ? IVANOV_REMONTI
              : getBusinesses().find(business => String(business.id) === String(id));
            const canPreviewBusiness = currentUser && item?.owner && (
              item.owner.email === currentUser.email || item.owner.name === currentUser.name
            );
            if (!item || (!isApproved(item) && !canPreviewBusiness)) {''', 'business access moderation')

          # Status badges in cards.
          replace_once('''  const testBadge = item.isTest ? '<span class="test-badge">ТЕСТ</span>' : "";''', '''  const testBadge = item.isTest ? '<span class="test-badge">ТЕСТ</span>' : "";
            const moderationBadge = !isApproved(item)
              ? `<span class="moderation-badge moderation-${escapeHtml(item.status || "pending")}">${escapeHtml(moderationLabel(item.status))}</span>`
              : "";''', 'question moderation badge')
          s = s.replace('''          ${testBadge}
                </div>''', '''          ${testBadge}${moderationBadge}
                </div>''')

          # Replace old admin question-only panel with moderation queues.
          start = s.index('function renderAdminQuestions() {')
          end = s.index('\nrenderAdminQuestions();', start)
          admin_code = r'''function updateModerationStatus(kind, id, status, note = "") {
            if (kind === "question") {
              const items = getQuestions();
              const item = items.find(entry => String(entry.id) === String(id));
              if (item) { item.status = status; item.moderationNote = note; saveQuestions(items); }
            }
            if (kind === "business") {
              const items = getBusinesses();
              const item = items.find(entry => String(entry.id) === String(id));
              if (item) { item.status = status; item.moderationNote = note; saveBusinesses(items); }
            }
            if (kind === "answer") {
              const items = getQuestions();
              for (const question of items) {
                const answer = (question.answers || []).find(entry => String(entry.id) === String(id));
                if (answer) { answer.status = status; answer.moderationNote = note; break; }
              }
              saveQuestions(items);
            }
            renderAdminModeration();
          }

          function moderationActions(kind, id) {
            return `<div class="moderation-actions">
              <button class="approve-content" data-kind="${kind}" data-id="${escapeHtml(id)}" type="button">Одобри</button>
              <button class="changes-content" data-kind="${kind}" data-id="${escapeHtml(id)}" type="button">За корекция</button>
              <button class="reject-content" data-kind="${kind}" data-id="${escapeHtml(id)}" type="button">Откажи</button>
            </div>`;
          }

          function renderAdminModeration() {
            const questionsContainer = qs("#admin-questions");
            const businessesContainer = qs("#admin-businesses");
            const answersContainer = qs("#admin-answers");
            const pendingQuestions = getQuestions().filter(item => !isApproved(item));
            const pendingBusinesses = getBusinesses().filter(item => !isApproved(item));
            const pendingAnswers = getQuestions().flatMap(question =>
              (question.answers || []).filter(answer => !isApproved(answer)).map(answer => ({...answer, questionTitle: question.title}))
            );

            if (questionsContainer) questionsContainer.innerHTML = pendingQuestions.length
              ? pendingQuestions.map(item => `<article class="moderation-card"><span class="moderation-badge">${escapeHtml(moderationLabel(item.status))}</span><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.description)}</p><small>${escapeHtml(item.author || "Гост")} · ${escapeHtml(item.category)}</small>${moderationActions("question", item.id)}</article>`).join("")
              : '<article class="empty-card"><p>Няма чакащи въпроси.</p></article>';

            if (businessesContainer) businessesContainer.innerHTML = pendingBusinesses.length
              ? pendingBusinesses.map(item => `<article class="moderation-card"><span class="moderation-badge">${escapeHtml(moderationLabel(item.status))}</span><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description)}</p><small>${escapeHtml(item.category)}</small>${moderationActions("business", item.id)}</article>`).join("")
              : '<article class="empty-card"><p>Няма чакащи фирми.</p></article>';

            if (answersContainer) answersContainer.innerHTML = pendingAnswers.length
              ? pendingAnswers.map(item => `<article class="moderation-card"><span class="moderation-badge">${escapeHtml(moderationLabel(item.status))}</span><h3>Отговор към: ${escapeHtml(item.questionTitle)}</h3><p>${escapeHtml(item.text)}</p><small>${escapeHtml(item.author || "Гост")}</small>${moderationActions("answer", item.id)}</article>`).join("")
              : '<article class="empty-card"><p>Няма чакащи отговори.</p></article>';

            const pendingTotal = pendingQuestions.length + pendingBusinesses.length + pendingAnswers.length;
            if (qs("#admin-pending-count")) qs("#admin-pending-count").textContent = pendingTotal;
            if (qs("#admin-questions-count")) qs("#admin-questions-count").textContent = pendingQuestions.length;
            if (qs("#admin-businesses-count")) qs("#admin-businesses-count").textContent = pendingBusinesses.length;
            if (qs("#admin-answers-count")) qs("#admin-answers-count").textContent = pendingAnswers.length;

            qsa(".approve-content").forEach(button => button.addEventListener("click", () => updateModerationStatus(button.dataset.kind, button.dataset.id, "approved")));
            qsa(".reject-content").forEach(button => button.addEventListener("click", () => {
              const note = window.prompt("Причина за отказ:", "Неподходящо или непълно съдържание") || "";
              updateModerationStatus(button.dataset.kind, button.dataset.id, "rejected", note);
            }));
            qsa(".changes-content").forEach(button => button.addEventListener("click", () => {
              const note = window.prompt("Какво трябва да се коригира?", "Моля, допълнете или коригирайте информацията.") || "";
              updateModerationStatus(button.dataset.kind, button.dataset.id, "needs_changes", note);
            }));
          }

          function updateAdminCounts() {
            if (qs("#admin-users-count")) qs("#admin-users-count").textContent = getStored("popitaiUsers", []).length;
          }

          renderAdminModeration();
          updateAdminCounts();
          '''
          s = s[:start] + admin_code + s[end + len('\nrenderAdminQuestions();'):]
          # Remove stale call if present later.
          s = s.replace('renderAdminQuestions();\nupdateAdminCounts();', 'renderAdminModeration();\nupdateAdminCounts();')

          script_path.write_text(s, encoding='utf-8')

          # Admin page: replace test-only panel and old layout.
          admin = Path('admin.html').read_text(encoding='utf-8')
          old_start = admin.index('    <section class="admin-test-tools">')
          old_end = admin.index('    </div>\n  </div>\n</section>', old_start) + len('    </div>')
          new_panel = '''    <section class="admin-test-tools admin-moderation-intro">
              <div>
                <span class="section-kicker">Задължително одобрение</span>
                <h2>Опашка за модерация</h2>
                <p>Въпроси, отговори и фирми не се показват публично преди одобрение.</p>
              </div>
            </section>

            <div class="admin-stats">
              <article><strong id="admin-users-count">0</strong><span>Регистрации</span></article>
              <article><strong id="admin-pending-count">0</strong><span>Общо чакащи</span></article>
              <article><strong id="admin-questions-count">0</strong><span>Въпроси</span></article>
              <article><strong id="admin-businesses-count">0</strong><span>Фирми</span></article>
              <article><strong id="admin-answers-count">0</strong><span>Отговори</span></article>
            </div>

            <div class="admin-moderation-grid">
              <section class="admin-content"><div class="block-heading"><h2>Чакащи въпроси</h2></div><div id="admin-questions" class="stack-list"></div></section>
              <section class="admin-content"><div class="block-heading"><h2>Чакащи фирми</h2></div><div id="admin-businesses" class="stack-list"></div></section>
              <section class="admin-content"><div class="block-heading"><h2>Чакащи отговори</h2></div><div id="admin-answers" class="stack-list"></div></section>
            </div>'''
          admin = admin[:old_start] + new_panel + admin[old_end:]
          admin = admin.replace('script.js?v=20260805-0205', 'script.js?v=20260805-0751')
          Path('admin.html').write_text(admin, encoding='utf-8')

          # User-facing wording and cache busting.
          for name in ['nov-vapros.html', 'dobavi-firma.html', 'vapros.html', 'profil.html', 'vhod.html', 'registracia.html']:
              p = Path(name)
              if p.exists():
                  text = p.read_text(encoding='utf-8').replace('script.js?v=20260805-0205', 'script.js?v=20260805-0751')
                  p.write_text(text, encoding='utf-8')

          # Moderation styles.
          css = Path('style.css').read_text(encoding='utf-8')
          css += r'''

          /* Mandatory admin moderation — 2026-08-05 */
          .admin-moderation-grid { display: grid; gap: 22px; }
          .admin-stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
          .moderation-card { padding: 20px; background: #fff; border: 1px solid #dbe2ec; border-radius: 16px; box-shadow: 0 8px 24px rgba(6,26,56,.06); }
          .moderation-card h3 { margin: 8px 0; color: #061a38; }
          .moderation-card small { display: block; margin-top: 10px; color: #64748b; }
          .moderation-badge { display: inline-flex; padding: 5px 9px; color: #775100; background: #fff3c4; border: 1px solid #e7c45b; border-radius: 999px; font-size: 12px; font-weight: 900; }
          .moderation-approved { color: #17613a; background: #e7f8ee; border-color: #9bd5b2; }
          .moderation-rejected { color: #8d2431; background: #fff0f1; border-color: #efb7be; }
          .moderation-needs_changes { color: #744f00; background: #fff5d8; border-color: #e6c363; }
          .moderation-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
          .moderation-actions button { padding: 9px 13px; border-radius: 9px; cursor: pointer; font-weight: 850; }
          .approve-content { color: #fff; background: #17613a; border: 1px solid #17613a; }
          .changes-content { color: #5f4300; background: #fff4cf; border: 1px solid #dfbb4c; }
          .reject-content { color: #8d2431; background: #fff; border: 1px solid #d99ba4; }
          @media (max-width: 900px) { .admin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
          @media (max-width: 560px) { .admin-stats { grid-template-columns: 1fr; } .moderation-actions button { width: 100%; } }
          '''
          Path('style.css').write_text(css, encoding='utf-8')

          # Document the production backend requirement clearly.
          Path('BACKEND-SETUP.md').write_text('''# Следващ етап: обща онлайн база данни

Текущата версия вече прилага работния процес „чака одобрение → одобрено/отказано/за корекция“ в тестовия браузър.

За реална публична работа между различни устройства са нужни:

1. Услуга за удостоверяване и база данни (препоръчително Supabase).
2. Потвърждение на имейл при регистрация.
3. Таблици за профили, въпроси, отговори, фирми, обяви, събития и сигнали.
4. Поле `status` със стойности `pending`, `approved`, `rejected`, `needs_changes`.
5. Правила за достъп: посетителите четат само `approved`; администраторът управлява всички записи.
6. Обектно хранилище за снимки и ограничения за размер/тип.

За свързването са нужни URL и публичен anon key на проекта. Администраторският service-role ключ никога не трябва да се поставя в публичния GitHub код.
''', encoding='utf-8')

          Path('.github/workflows/apply-moderation.yml').unlink()
          PY

          git config user.name "Popitai Lom Moderation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Задължително администраторско одобрение на съдържанието"
          git push origin HEAD:main
