name: Apply approved category icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-category-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the exact approved category icons
        run: python3 .github/scripts/apply-approved-category-icons.py
      - name: Commit the corrected icons
        run: |
          git config user.name "Popitai Lom Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Поставяне на точно избраните икони по категории"
          git push origin HEAD:main
