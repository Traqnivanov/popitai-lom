name: Apply final category icons

on:
  push:
    paths:
      - '.github/workflows/apply-category-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selected icon system
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          icons = {
              "maistori.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 18 2l4 4-3.5 3.5"/><path d="m13 7 4 4"/><path d="M5 3l4 4-2 2-4-4V3h2Z"/><path d="m7 9 12 12"/><path class="icon-accent" d="m3 21 6-6"/></svg>''',
              "zdrave.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/><path class="icon-accent icon-heart" d="M8.5 12.3c1.1-1.5 3.2-.9 3.5.4.3-1.3 2.4-1.9 3.5-.4 1.4 2-1 4-3.5 5.7-2.5-1.7-4.9-3.7-3.5-5.7Z"/></svg>''',
              "avtomobili.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h16l-1.7-5a2 2 0 0 0-1.9-1.4H7.6A2 2 0 0 0 5.7 9L4 14Z"/><path d="M3 14v4a1 1 0 0 0 1 1h2M21 14v4a1 1 0 0 1-1 1h-2M8 19h8"/><circle class="icon-accent" cx="7" cy="15.5" r="1.2"/><circle class="icon-accent" cx="17" cy="15.5" r="1.2"/></svg>''',
              "magazini.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 13H5L6 8Z"/><path class="icon-accent" d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>''',
              "zavedenia.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v7M2.5 3v4.5A2.5 2.5 0 0 0 5 10a2.5 2.5 0 0 0 2.5-2.5V3M5 10v11"/><path class="icon-accent" d="m17.5 3-7 18M14.8 3l5.7 2-2.3 6.5"/></svg>''',
              "rabota.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/><path class="icon-accent" d="M10 12v3h4v-3"/></svg>''',
              "obyavi.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 8.5v7M8 9l10-4v14L8 15Z"/><path d="m8 15 2.5 5"/><path class="icon-accent" d="M20 8.5c1 .8 1.5 2 1.5 3.5S21 14.7 20 15.5"/></svg>''',
              "sabitiya.html": '''<svg class="brand-category-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path class="icon-accent" d="m12 12.5 1.1 2.2 2.4.4-1.8 1.7.4 2.4-2.1-1.1-2.1 1.1.4-2.4-1.8-1.7 2.4-.4L12 12.5Z"/></svg>''',
          }

          category_data = [
              ("Майстори и ремонти", "maistori", "blue", "maistori.html"),
              ("Здраве и лекари", "zdrave", "mint", "zdrave.html"),
              ("Автомобили", "avtomobili", "slate", "avtomobili.html"),
              ("Магазини и покупки", "magazini", "sand", "magazini.html"),
              ("Заведения", "zavedenia", "rose", "zavedenia.html"),
              ("Работа и услуги", "rabota", "violet", "rabota.html"),
              ("Обяви", "obyavi", "teal", "obyavi.html"),
              ("Събития и град", "sabitiya", "blue", "sabitiya.html"),
          ]

          def replace_icon_after_marker(text, marker_pattern, svg):
              pattern = re.compile(rf'({marker_pattern}.*?)(<svg\b[^>]*>.*?</svg>)', re.S)
              updated, count = pattern.subn(lambda m: m.group(1) + svg, text, count=1)
              if count != 1:
                  raise RuntimeError(f"Icon marker not found: {marker_pattern}")
              return updated

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          for _, _, _, filename in category_data:
              href = re.escape(filename)
              marker = rf'<a class="category-main-link" href="{href}">\s*<span class="category-icon[^\"]*"[^>]*>\s*'
              index = replace_icon_after_marker(index, marker, icons[filename])
          index_path.write_text(index, encoding="utf-8")

          directory_path = Path("kategorii.html")
          directory = directory_path.read_text(encoding="utf-8")
          for _, _, _, filename in category_data:
              href = re.escape(filename)
              marker = rf'<a href="{href}">\s*<div class="directory-icon[^\"]*"[^>]*>\s*'
              directory = replace_icon_after_marker(directory, marker, icons[filename])
          directory_path.write_text(directory, encoding="utf-8")

          for _, _, _, filename in category_data:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              pattern = re.compile(r'(<span class="category-symbol[^\"]*"[^>]*>)<svg\b[^>]*>.*?</svg>(</span><h1>)', re.S)
              text, count = pattern.subn(lambda m: m.group(1) + icons[filename] + m.group(2), text, count=1)
              if count != 1:
                  raise RuntimeError(f"Category hero icon not found in {filename}")
              path.write_text(text, encoding="utf-8")

          script_path = Path("script.js")
          script = script_path.read_text(encoding="utf-8")
          meta = {
              label: {"slug": slug, "className": cls, "icon": re.sub(r'^<svg[^>]*>|</svg>$', '', icons[filename])}
              for label, slug, cls, filename in category_data
          }
          new_constant = "const CATEGORY_META = " + json.dumps(meta, ensure_ascii=False) + ";"
          script, count = re.subn(r'const CATEGORY_META = \{.*?\};', lambda _: new_constant, script, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("CATEGORY_META was not found")
          script_path.write_text(script, encoding="utf-8")

          css_path = Path("style.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* FINAL CATEGORY ICON SYSTEM 2026-08-05 */"
          css = css.split(marker)[0].rstrip() + "\n\n" + marker + r'''

          .category-icon,
          .directory-icon,
          .category-symbol {
            background: #fffaf0 !important;
            color: #061a38 !important;
            border: 2px solid #123b6d !important;
            border-radius: 50% !important;
            box-shadow: 0 7px 18px rgba(6, 26, 56, 0.10) !important;
          }

          .category-icon svg,
          .directory-icon svg,
          .category-symbol svg,
          .brand-category-svg {
            fill: none !important;
            stroke: #123b6d !important;
            stroke-width: 1.8 !important;
            stroke-linecap: round !important;
            stroke-linejoin: round !important;
          }

          .category-icon .icon-accent,
          .directory-icon .icon-accent,
          .category-symbol .icon-accent,
          .brand-category-svg .icon-accent {
            stroke: #d49a13 !important;
          }

          .category-icon .icon-heart,
          .directory-icon .icon-heart,
          .category-symbol .icon-heart {
            fill: rgba(212, 154, 19, 0.10) !important;
          }

          .category-copy strong,
          .directory-card h2,
          .page-hero-title-row h1 {
            color: #061a38 !important;
          }

          .category-card:hover .category-icon,
          .directory-card:hover .directory-icon {
            background: #fff5d8 !important;
            border-color: #d49a13 !important;
            transform: translateY(-2px);
          }
          ''' + "\n"
          css_path.write_text(css, encoding="utf-8")

          cache_version = "20260805-0736"
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'href="style\.css(?:\?v=[^\"]*)?"', f'href="style.css?v={cache_version}"', text)
              path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-category-icons.yml

          git config user.name "Popitai Lom Design"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Актуализиране на финалните икони по категории"
          git push origin HEAD:main
