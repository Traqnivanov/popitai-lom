name: Stage 2 final Chromium interaction QA 3

on:
  push:
    branches:
      - prototype/stage2-final-browser-qa3-20260905-tmp

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve harness and detach exact candidate
        run: |
          test "$(git rev-parse HEAD^^)" = "8682487d0d2b586b0c8a7cd7637e15d5e4251965"
          mkdir -p /tmp/stage2-browser-qa
          cp .github/stage2-browser-qa.mjs /tmp/stage2-browser-qa/stage2-browser-qa.mjs
          git checkout --detach 8682487d0d2b586b0c8a7cd7637e15d5e4251965
          test -z "$(git status --short)"
      - name: Syntax-check QA harness
        run: node --check /tmp/stage2-browser-qa/stage2-browser-qa.mjs
      - name: Install browser driver only in temp directory
        working-directory: /tmp/stage2-browser-qa
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core >/dev/null
      - name: Run desktop and 390px Chromium QA
        run: |
          CHROME_PATH="$(which google-chrome-stable || which google-chrome || which chromium || true)"
          test -n "$CHROME_PATH"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/stage2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cd /tmp/stage2-browser-qa
          CHROME_PATH="$CHROME_PATH" node stage2-browser-qa.mjs
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-chromium-qa3-8682487
          path: /tmp/stage2-browser-qa/qa-artifacts
          if-no-files-found: warn
