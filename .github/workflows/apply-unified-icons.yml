name: Apply unified icon style

on:
  push:
    paths:
      - '.github/workflows/apply-unified-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply navy and gold icon system
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* UNIFIED NAVY-GOLD ICONS */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n'

          block = r'''
/* UNIFIED NAVY-GOLD ICONS */
:root {
  --icon-navy: #061a38;
  --icon-navy-light: #0b2f61;
  --icon-gold: #f4bd4a;
  --icon-gold-soft: #ffd86a;
}

.category-icon,
.category-symbol,
.directory-icon,
.image-dropzone-icon {
  width: 54px !important;
  height: 54px !important;
  min-width: 54px !important;
  display: inline-grid !important;
  place-items: center !important;
  color: var(--icon-gold) !important;
  background: linear-gradient(145deg, var(--icon-navy), var(--icon-navy-light)) !important;
  border: 1px solid rgba(244, 189, 74, 0.58) !important;
  border-radius: 50% !important;
  box-shadow: 0 10px 24px rgba(6, 26, 56, 0.20) !important;
}

.category-icon svg,
.category-symbol svg,
.directory-icon svg,
.image-dropzone-icon svg {
  width: 27px !important;
  height: 27px !important;
  fill: none !important;
  stroke: currentColor !important;
  stroke-width: 1.9 !important;
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
}

.category-icon svg *,
.category-symbol svg *,
.directory-icon svg *,
.image-dropzone-icon svg * {
  fill: none !important;
  stroke: currentColor !important;
}

.category-card:hover .category-icon,
.directory-card:hover .directory-icon,
.subcategory-card:hover .category-symbol {
  color: var(--icon-gold-soft) !important;
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(6, 26, 56, 0.26) !important;
}

.mobile-bottom-nav a > svg {
  width: 31px !important;
  height: 31px !important;
  padding: 6px !important;
  color: var(--icon-gold) !important;
  background: var(--icon-navy) !important;
  border: 1px solid rgba(244, 189, 74, 0.48) !important;
  border-radius: 50% !important;
  fill: none !important;
  stroke: currentColor !important;
  stroke-width: 1.9 !important;
}

.mobile-bottom-nav a > svg * {
  fill: none !important;
  stroke: currentColor !important;
}

.mobile-bottom-nav a.active > svg,
.mobile-bottom-nav .mobile-ask > svg {
  color: var(--icon-gold-soft) !important;
  background: var(--icon-navy-light) !important;
  box-shadow: 0 7px 18px rgba(6, 26, 56, 0.24) !important;
}

.ask-button svg,
.primary-link-button svg,
.secondary-link-button svg,
.back-to-top svg {
  color: var(--icon-gold) !important;
  stroke: currentColor !important;
}

.search-icon {
  stroke: var(--icon-navy-light) !important;
}

@media (max-width: 760px) {
  .category-icon,
  .category-symbol,
  .directory-icon,
  .image-dropzone-icon {
    width: 50px !important;
    height: 50px !important;
    min-width: 50px !important;
  }

  .category-icon svg,
  .category-symbol svg,
  .directory-icon svg,
  .image-dropzone-icon svg {
    width: 25px !important;
    height: 25px !important;
  }
}
'''
          path.write_text(css.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/apply-unified-icons.yml
          git config user.name "Popitai Lom Design"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Уеднаквяване на всички икони в тъмносиньо и златно"
          git push origin HEAD:main
