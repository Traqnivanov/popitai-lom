name: Post-marketplace IA guard

on:
  pull_request:
    paths:
      - 'public-shell-manifest-v1.json'
      - '*.html'
      - '.github/scripts/sync_public_shell.py'
      - '.github/workflows/post-marketplace-breadcrumb-recovery.yml'
  push:
    branches:
      - main
    paths:
      - 'public-shell-manifest-v1.json'
      - '*.html'
      - '.github/scripts/sync_public_shell.py'
      - '.github/workflows/post-marketplace-breadcrumb-recovery.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard legacy Categories semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('public-shell-manifest-v1.json').read_text(encoding='utf-8'))
          bad = []
          for name, cfg in (manifest.get('pages') or {}).items():
              if cfg.get('nav') == 'categories' or cfg.get('mobile') == 'categories':
                  bad.append(name)
          if bad:
              raise SystemExit('Legacy categories semantic key remains in: ' + ', '.join(sorted(bad)))
          print('Manifest semantic guard PASS: no legacy categories key.')
          PY

      - name: Guard legacy Categories breadcrumbs
        run: |
          if grep -R --include='*.html' -nE 'href="kategorii\.html"[^>]*>[[:space:]]*Категории[[:space:]]*</a>' .; then
            echo 'Legacy Categories breadcrumb remains.' >&2
            exit 1
          fi
          echo 'Breadcrumb guard PASS.'

      - name: Verify canonical public shell
        run: python .github/scripts/sync_public_shell.py --check
