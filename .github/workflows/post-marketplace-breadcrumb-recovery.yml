name: Post-marketplace breadcrumb recovery

on:
  push:
    branches:
      - post-marketplace-regression-1

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-marketplace-regression-1
          fetch-depth: 1

      - name: Replace legacy Categories breadcrumbs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r'<a([^>]*?)href="kategorii\.html"([^>]*)>\s*Категории\s*</a>', re.I)
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8-sig')
              updated = pattern.sub(r'<a\1href="obyavi.html"\2>Обяви и услуги</a>', text)
              if updated != text:
                  bom = path.read_bytes().startswith(b'\xef\xbb\xbf')
                  path.write_bytes((b'\xef\xbb\xbf' if bom else b'') + updated.encode('utf-8'))
                  changed.append(path.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Verify canonical public shell
        run: python .github/scripts/sync_public_shell.py --check

      - name: Guard old breadcrumb label
        run: |
          if grep -R --include='*.html' -nE 'href="kategorii\.html"[^>]*>[[:space:]]*Категории[[:space:]]*</a>' .; then
            echo 'Legacy Categories breadcrumb remains.' >&2
            exit 1
          fi

      - name: Commit recovery when needed
        run: |
          if git diff --quiet; then
            echo 'Breadcrumbs already canonical.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Replace legacy Categories breadcrumbs"
          git push origin "HEAD:post-marketplace-regression-1"
