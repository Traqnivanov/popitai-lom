name: Apply Supabase authentication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-supabase-auth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect registration and login to Supabase
        run: python3 .github/scripts/apply-supabase-auth.py
      - name: Commit the Supabase integration
        run: |
          git config user.name "Popitai Lom Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Свързване на регистрацията и входа със Supabase"
          git push origin HEAD:main
