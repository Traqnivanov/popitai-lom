<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Грижа за хора и животни — 390px QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#111827;font-family:Arial,sans-serif}.qa{width:390px;margin:0 auto 12px;padding:10px 12px;border-radius:10px;background:#fff;color:#111827;font-weight:700;font-size:13px}.qa.pass{background:#dcfce7;color:#14532d}.qa.fail{background:#fee2e2;color:#7f1d1d}.frame{display:block;width:390px;height:844px;margin:auto;border:0;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  </style>
</head>
<body>
  <div id="qa" class="qa">QA: checking…</div>
  <iframe id="frame" class="frame" title="Икони за грижа при 390 пиксела" src="index.html#service-group?group=%D0%93%D1%80%D0%B8%D0%B6%D0%B0+%D0%B7%D0%B0+%D1%85%D0%BE%D1%80%D0%B0+%D0%B8+%D0%B6%D0%B8%D0%B2%D0%BE%D1%82%D0%BD%D0%B8&amp;mode=browse"></iframe>
  <script>
    const frame=document.getElementById('frame');
    const qa=document.getElementById('qa');
    frame.addEventListener('load',()=>setTimeout(()=>{
      try{
        const d=frame.contentDocument;
        const cards=[...d.querySelectorAll('.family-card')];
        const imgs=[...d.querySelectorAll('.service-card-icon img')];
        const broken=imgs.filter(img=>!img.complete||img.naturalWidth!==128||img.naturalHeight!==128);
        const overflow=d.documentElement.scrollWidth>d.documentElement.clientWidth;
        const pass=cards.length===5&&imgs.length===5&&broken.length===0&&!overflow;
        qa.className=`qa ${pass?'pass':'fail'}`;
        qa.textContent=`QA: ${pass?'PASS':'FAIL'} · cards=${cards.length}/5 · images=${imgs.length}/5 · broken=${broken.length} · horizontal-overflow=${overflow?'YES':'NO'}`;
      }catch(err){
        qa.className='qa fail';
        qa.textContent=`QA: FAIL · ${err.message}`;
      }
    },500));
  </script>
</body>
</html>
