rviceFamilies.flatMap(f=>f.slice(1)).every(x=>PopitaiStage2Contracts.serviceCanonical(x))');const cat=d.getElementById('listing-category');cat.value='Работа';cat.dispatchEvent(new Event('change',{bubbles:true}));await wait(100);r.manualCategoryClearsDiscovery=form.dataset.discoveryContext===''&&d.querySelector('.discovery-context')?.hidden===true;r.manualCategoryUpdatesAdapter=adapter().includes('category=Работа')&&adapter().includes('subcategory=—');r.noStaleCateringAfterChange=!adapter().includes('Кетъринг')&&!d.querySelector('[name="Заглавие"]').placeholder.toLowerCase().includes('кетъринг');const kinds=['publication','shop','health','event'];r.share={};for(const kind of kinds){r.share[kind]={};for(const state of ['eligible','blocked']){await load(`#detail/${kind}?share=${state}`);d=frame.contentDocument;const hasShare=!!d.querySelector('.share-menu'),hasCard=!!d.querySelector('.social-card'),hasPanel=[...d.querySelectorAll('summary')].some(x=>x.textContent.includes('Условни Share примери')),blockedText=d.body.textContent.includes('Share не е наличен в този пример.');r.share[kind][state]=state==='eligible'?hasShare&&hasCard&&hasPanel:!hasShare&&!hasCard&&hasPanel&&blockedText;if(kind==='event'&&state==='blocked')r.eventBlockedLifecycleConsistent=!d.body.textContent.includes('например е приключило');}}await load('#home');d=frame.contentDocument;w=frame.contentWindow;const market=[...d.querySelectorAll('section.section')].find(s=>s.querySelector('h2')?.textContent.trim()==='Обяви и услуги');r.homeSpecialInsideMarketplace=!!market&&[...market.querySelectorAll('h2')].some(h=>h.textContent.trim()==='Местни специализирани раздели');r.normalizeFunctionAbsent=typeof w.normalizeHomeComposition==='undefined';const homeText=d.body.textContent;r.publicationNoMandatoryShortClaim=!homeText.includes('Кратка местна актуализация')&&!homeText.includes('Кратки местни публикации');r.mobileWidth=frame.clientWidth===390;out.textContent=JSON.stringify(r,null,2);}run().catch(e=>out.textContent=JSON.stringify({error:String(e),stack:e.stack},null,2));</script></body></html>
