<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Stage 2 acceptance QA</title><style>body{font-family:system-ui;margin:16px}pre{white-space:pre-wrap;background:#111;color:#d7ffd7;padding:16px}iframe{width:390px;height:844px;border:1px solid #aaa}</style></head><body><pre id="out">running…</pre><iframe id="qa" title="acceptance QA"></iframe><script>const out=document.getElementById('out'),frame=document.getElementById('qa');const wait=ms=>new Promise(r=>setTimeout(r,ms));function load(hash){return new Promise(resolve=>{frame.onload=()=>setTimeout(resolve,80);frame.src='index.html?v=acceptance-qa'+hash;});}async function run(){const r={};await load('#add/listing?category=%D0%A3%D1%81%D0%BB%D1%83%D0%B3%D0%B8&subcategory=%D0%A4%D0%BE%D1%82%D0%BE%2C%20%D0%B2%D0%B8%D0%B4%D0%B5%D0%BE%20%D0%B8%20%D1%81%D1%8A%D0%B1%D0%B8%D1%82%D0%B8%D0%B9%D0%BD%D0%B8%20%D1%83%D1%81%D0%BB%D1%83%D0%B3%D0%B8&discovery=%D0%9A%D0%B5%D1%82%D1%8A%D1%80%D0%B8%D0%BD%D0%B3');let d=frame.contentDocument,w=frame.contentWindow,form=d.querySelector('[data-proto-form][data-form-kind="listing"]');const adapter=()=>d.querySelector('.qa-adapter')?.textContent||'';r.initialDiscoveryVisible=(d.querySelector('.discovery-context')?.textContent||'').includes('Кетъринг');r.initialCanonicalAdapter=adapter().includes('Фото, видео и събитийни услуги');r.initialLockedBoundary=adapter().includes('не може надеждно да бъде възстановен');const cat=d.getElementById('listing-category');cat.value='Работа';cat.dispatchEvent(new Event('change',{bubbles:true}));await wait(80);r.manualCategoryClearsDiscovery=form.dataset.discoveryContext===''&&d.querySelector('.discovery-context')?.hidden===true;r.manualCategoryUpdatesAdapter=adapter().includes('category=Работа')&&adapter().includes('subcategory=—');r.noStaleCateringAfterChange=!adapter().includes('Кетъринг')&&!d.querySelector('[name="Заглавие"]').placeholder.toLowerCase().includes('кетъринг');const kinds=['publication','shop','health','event'];r.share={};for(const kind of kinds){r.share[kind]={};for(const state of ['eligible','blocked']){await load(`#detail/${kind}?share=${state}`);d=frame.contentDocument;const hasShare=!!d.querySelector('.share-menu'),hasCard=!!d.querySelector('.social-card'),hasPanel=[...d.querySelectorAll('summary')].some(x=>x.textContent.includes('Условни Share примери'));const blockedText=d.body.textContent.includes('Share не е наличен в този пример.');r.share[kind][state]=state==='eligible'?hasShare&&hasCard&&hasPanel:!hasShare&&!hasCard&&hasPanel&&blockedText;}}await load('#home');d=frame.contentDocument;r.homeSpecialInsideMarketplace=(()=>{const market=[...d.querySelectorAll('section.section')].find(s=>s.querySelector('h2')?.textContent.trim()==='Обяви и услуги');return !!market&&!![...market.querySelectorAll('h2')].find(h=>h.textContent.trim()==='Местни специализирани раздели');})();r.publicationNoMandatoryShortClaim=!d.body.textContent.includes('Кратка местна актуализация')&&!d.body.textContent.includes('Кратки местни публикации');out.textContent=JSON.stringify(r,null,2);}run().catch(e=>out.textContent=JSON.stringify({error:String(e),stack:e.stack},null,2));</script></body></html>
