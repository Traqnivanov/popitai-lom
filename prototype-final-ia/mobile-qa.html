<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Stage 2 mobile QA</title><style>html,body{margin:0;background:#737b85;font-family:system-ui}main{width:390px;height:844px;margin:0 auto;background:#fff}iframe{display:block;width:390px;height:844px;border:0;background:#fff}pre{position:fixed;left:8px;top:8px;z-index:10;max-width:620px;max-height:92vh;overflow:auto;background:#111;color:#d7ffd7;padding:12px;white-space:pre-wrap}</style></head><body><pre id="out" hidden></pre><main><iframe id="qa" title="390px mobile QA"></iframe></main><script>const frame=document.getElementById('qa'),out=document.getElementById('out');const wait=ms=>new Promise(r=>setTimeout(r,ms));async function autoTest(){const w=frame.contentWindow,d=frame.contentDocument,form=d.querySelector('[data-proto-form][data-form-kind="listing"]'),r={};if(!form){r.formFound=false;return r}r.formFound=true;const title=form.querySelector('[name="Заглавие"]'),type=form.querySelector('[name="Тип обява"]'),desc=form.querySelector('[name="Описание"]'),phone=form.querySelector('[name="Телефон"]'),terms=form.querySelector('[name="community_terms"]');title.value='Запазен пример';title.dispatchEvent(new Event('input',{bubbles:true}));r.invalidRejected=w.validatePrototypeForm(form)===false;r.enteredValuePreserved=title.value==='Запазен пример';const invalid=[...form.querySelectorAll('[aria-invalid="true"]')];r.fieldErrors=invalid.length>0&&invalid.every(c=>{const id=(c.getAttribute('aria-describedby')||'').split(/\s+/)[0];return id&&d.getElementById(id)?.textContent.trim()});r.focusFirstError=invalid.length>0&&d.activeElement===invalid[0];r.labelsConnected=[...form.querySelectorAll('input[id],select[id],textarea[id]')].filter(c=>!['checkbox','file'].includes(c.type)).every(c=>!!form.querySelector(`label[for="${CSS.escape(c.id)}"]`));r.requiredDescribed=[...form.querySelectorAll('[required]')].every(c=>!!c.getAttribute('aria-describedby'));type.value='Продава';desc.value='Това е достатъчно подробно описание за реален тест на валидацията.';phone.value='0876123456';terms.checked=true;r.validAccepted=w.validatePrototypeForm(form)===true;form.dataset.dirty='true';const before=w.location.hash;w.confirm=()=>false;w.location.hash='#home';await wait(120);r.hashNavigationBlocked=w.location.hash===before;const ev=new Event('beforeunload',{cancelable:true});w.dispatchEvent(ev);r.beforeUnloadProtected=ev.defaultPrevented;w.confirm=()=>true;form.dataset.dirty='false';form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await wait(80);r.successReplacesForm=!!form.querySelector('[data-success-card]')&&!form.querySelector('button[type="submit"]');r.successNotResubmittable=form.dataset.submitted==='true';const leaves=w.eval('serviceFamilies.flatMap(f=>f.slice(1))');r.serviceLeafCount=leaves.length;r.allServiceLeavesMapped=leaves.every(n=>w.PopitaiStage2Contracts.serviceCanonical(n));r.allServiceUrlsPreserveDiscovery=leaves.every(n=>{const u=w.eval(`stage2AddTarget('Услуги',${JSON.stringify(n)},'Listings','')`);return u.includes('category=%D0%A3%D1%81%D0%BB%D1%83%D0%B3%D0%B8')&&u.includes('discovery=')&&u.includes('subcategory=')});r.autoPartsStillService=w.PopitaiStage2Contracts.activeServiceCanonical.includes('Авточасти');const groups={work:w.eval('workGroups'),imoti:w.eval('propertyKinds'),auto:w.eval('autoListingGroups'),animals:w.eval('animalGroups')};r.nonServiceDiscoveryNoSubcategory=Object.entries(groups).every(([k,arr])=>arr.every(n=>{const ctx=k==='work'?'Работа':k==='imoti'?'Имоти':k==='auto'?'Автомобили':'Животни';const u=w.eval(`stage2AddTarget(${JSON.stringify(ctx)},${JSON.stringify(n)},'Listings','')`);return u.includes('discovery=')&&!u.includes('subcategory=')}));r.editBeatsCreatePrefill=w.eval(`listingCategory(new URLSearchParams('state=edit&category=Услуги'))`)==='Дом и градина';return r}function sync(){frame.onload=async()=>{try{const result=await autoTest();out.hidden=false;out.textContent=JSON.stringify(result,null,2)}catch(e){out.hidden=false;out.textContent=JSON.stringify({error:String(e)},null,2)}};frame.src='index.html?v=mobile-qa#add/listing?category=%D0%A3%D1%81%D0%BB%D1%83%D0%B3%D0%B8&subcategory=%D0%92%D0%B8%D0%9A&discovery=%D0%92%D0%B8%D0%9A'}sync();</script></body></html>
