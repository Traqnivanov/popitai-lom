<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Stage 2 Social image QA</title><style>body{font-family:system-ui;margin:16px;background:#777}pre{position:fixed;z-index:10;left:12px;top:12px;width:min(760px,calc(100vw - 440px));max-height:92vh;overflow:auto;white-space:pre-wrap;background:#111;color:#d7ffd7;padding:14px}iframe{display:block;width:390px;height:844px;border:0;background:#fff;margin-left:auto}</style></head><body><pre id="out">running…</pre><iframe id="qa" title="390px Social image QA"></iframe><script>const out=document.getElementById('out'),frame=document.getElementById('qa');const kinds=['listing','firm','shop','health','event','article','publication','question','info'];const modes=['real','template','lom'];function load(hash){return new Promise(resolve=>{frame.onload=()=>setTimeout(resolve,100);frame.src='index.html?v=social-image-qa'+hash;});}async function run(){const r={types:{},summary:{}};for(const kind of kinds){r.types[kind]={};for(const mode of modes){await load(`#detail/${kind}?share=eligible&image=${mode}`);const d=frame.contentDocument,w=frame.contentWindow,preview=d.querySelector('.social-preview-section'),image=d.querySelector('.og-image-frame'),meta=d.querySelector('.facebook-preview-meta'),qa=d.querySelector('.qa-social-note'),rect=image?.getBoundingClientRect(),ratio=rect&&rect.height?rect.width/rect.height:0;const bg=image?w.getComputedStyle(image).backgroundImage:'';r.types[kind][mode]={level:image?.dataset.imageLevel===mode,ratio1200x630:Math.abs(ratio-(1200/630))<0.03,separated:!!preview&&!!image&&!!meta&&!!qa&&!image.contains(meta)&&!image.contains(qa),metadataSeparate:(meta?.textContent||'').includes('TRAQNIVANOV.GITHUB.IO')&&(meta?.querySelector('strong')?.textContent||'').trim().length>0&&(meta?.querySelector('p')?.textContent||'').trim().length>0,noInventedImageElement:!image?.querySelector('img'),templateBrand:mode!=='template'||(image?.textContent||'').includes('Попитай.Лом'),realNeutral:mode!=='real'||(image?.textContent||'').includes('Прототипът умишлено не измисля снимка или лице.'),lomLastFallback:mode!=='lom'||(bg.includes('lom-cover-share-1200x630.webp')&&(image?.textContent||'').includes('Попитай.Лом')),productionBoundary:(qa?.textContent||'').includes('JavaScript симулация след зареждане не е достатъчна')};}}const rows=Object.values(r.types).flatMap(x=>Object.values(x));r.summary={typeCount:kinds.length,stateCount:rows.length,allLevels:rows.every(x=>x.level),allRatios:rows.every(x=>x.ratio1200x630),allSeparated:rows.every(x=>x.separated),allMetadataSeparate:rows.every(x=>x.metadataSeparate),noInventedImageElements:rows.every(x=>x.noInventedImageElement),allTemplateBrand:rows.every(x=>x.templateBrand),allRealNeutral:rows.every(x=>x.realNeutral),allLomFallback:rows.every(x=>x.lomLastFallback),allProductionBoundary:rows.every(x=>x.productionBoundary),mobileFrame390:frame.clientWidth===390,oldSocialCardAbsent:!frame.contentDocument.querySelector('.social-card')};out.textContent=JSON.stringify(r,null,2);}run().catch(e=>out.textContent=JSON.stringify({error:String(e),stack:e.stack},null,2));</script></body></html>
